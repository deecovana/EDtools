LastGalnetArticle="Terri Tora Released by October Consortium in Surprise Move~|~09 JUL 3312"
LastGalnetArticleText="Terri Tora, the xenobiologist credited with triggering widespread interest in the HIP 87621 system, has been released.<n>Tora, who has been held in custody by October Consortium since her disappearance in late 3311, was investigating rumours of a significant xenobiological discovery when she stowed away on a Consortium megaship. She was later discovered in HIP 87621, having circumnavigated the system's permit lock, and incarcerated on charges of corporate espionage.<n>Speaking directly to Vox Galactica, Lexi October said that Tora had been fully cooperative in questioning following the security breach and recognised that recent events leading to the signing of the Accords had meant it was time to release her without further charges.<n>Tora issued the following statement:<n>Well, that was an adventure I can tell you! I am relieved to be finally free and to know that things worked out in the end. It was a scary situation to be in.<n>I hadn't considered the ramifications of my actions until fighting broke out across the surrounding systems. However, the supposed value of Radicoida wasn't my concern - my only motive was knowledge. Discoveries like this aren't meant to be kept a secret!<n>Tora was met by colleague Professor Frank Raddix, who initially tipped off pilots about her absence, at Exogene Sciences. The pair then departed under October Accord escort."
